<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetHub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1120;
            --panel: #111b33;
            --border: #263452;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --primary: #60a5fa;
            --primary-soft: rgba(96, 165, 250, 0.16);
            --success: #22c55e;
            --danger: #f87171;
            --warning: #facc15;
            --surface: #152239;
        }
        body {
            background: radial-gradient(circle at top, #16213c 0%, var(--bg) 55%, #08111f 100%);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }
        .page-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 36px 20px 56px;
        }
        .brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding: 28px 32px;
            background: rgba(17, 27, 51, 0.94);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }
        .brand-bar h2 {
            margin: 0;
            font-size: 1.75rem;
            letter-spacing: -0.04em;
            color: var(--primary);
        }
        .card-soft {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.24);
        }
        .card-soft .card-body {
            padding: 30px;
        }
        .form-control,
        .form-select {
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            box-shadow: none;
            min-height: 50px;
        }
        .form-control::placeholder {
            color: rgba(248, 250, 252, 0.68);
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(96, 165, 250, 0.18);
            background: rgba(255, 255, 255, 0.08);
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            border-radius: 16px;
            min-width: 140px;
            color: #0f172a;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .btn-secondary,
        .btn-outline-secondary,
        .btn-warning,
        .btn-danger,
        .btn-success {
            border-radius: 16px;
            min-width: 120px;
        }
        .btn-secondary {
            background-color: #1e293b;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
            background-color: #293147;
        }
        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
            color: #071f0f;
        }
        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
            color: #111827;
        }
        .btn-warning {
            background-color: var(--warning);
            border-color: var(--warning);
            color: #111827;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }
        .contact-card {
            min-height: 220px;
            position: relative;
        }
        .contact-card .card-body {
            padding: 26px;
        }
        .contact-card h5 {
            font-size: 1.15rem;
            margin-bottom: 14px;
            color: var(--text);
        }
        .contact-card p {
            margin-bottom: 10px;
            color: var(--muted);
        }
        .badge-tech {
            background: rgba(96, 165, 250, 0.14);
            color: var(--primary);
            border-radius: 999px;
            font-weight: 600;
            padding: 0.55em 0.85em;
        }
        .list-group-item {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
        }
        .list-group-item:last-child {
            margin-bottom: 0;
        }
        .alert-info {
            background: rgba(96, 165, 250, 0.08);
            color: var(--text);
            border-color: rgba(96, 165, 250, 0.2);
            border-radius: 16px;
        }
        .section-title {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .meta-text {
            color: rgba(248, 250, 252, 0.70);
        }
        a.stretched-link::after {
            position: absolute;
            inset: 0;
        }
    </style>
</head>
<body>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
