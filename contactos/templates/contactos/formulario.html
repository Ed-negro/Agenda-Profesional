<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NetHub - {% if es_edicion %}Editar{% else %}Registrar{% endif %} Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{% if es_edicion %}Editar Contacto: {{ contacto.nombre }}{% else %}Registrar Nuevo Contacto{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %} {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% if es_edicion %}{% url 'detalle_contacto' contacto.id %}{% else %}{% url 'lista_contactos' %}{% endif %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">{% if es_edicion %}Guardar Cambios{% else %}Guardar Contacto{% endif %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
